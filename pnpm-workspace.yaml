packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: true
overrides:
  axios: ">=1.20.0"
  # GHSA-mrhx-c7xc-m3w5: @x402/core declares zod 3, which has no patch; it only uses APIs that
  # are identical in zod 4 (see the @agentpos/core README).
  zod: "^4.6.6"
minimumReleaseAgeExclude:
  # Our own packages, published by our release workflow with provenance: no hold-back.
  - "@agentpos/*"
